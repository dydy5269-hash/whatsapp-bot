<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الطلبات</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      padding: 20px;
    }

    .card {
      background: #222;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .status {
      color: #00ffcc;
    }
  </style>
</head>
<body>

<h2>📊 الطلبات</h2>

<div id="orders"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAJAJe3NgjQIeNihq0pTreixKhdQaGxvrE",
    authDomain: "taqa-services.firebaseapp.com",
    projectId: "taqa-services",
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const container = document.getElementById("orders");

  db.collection("orders")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {
      container.innerHTML = "";

      snapshot.forEach(doc => {
        const data = doc.data();

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <b>📞 العميل:</b> ${data.phone}<br>
          <b>🔧 الخدمة:</b> ${data.service}<br>
          <b class="status">📊 الحالة:</b> ${data.status}<br>
          <b>👨‍🔧 الفني:</b> ${data.technicianName || "..." }
        `;

        container.appendChild(div);
      });
    });
</script>

</body>
</html>
