<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

h1{
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:20px;
border-radius:10px;
}

input,button{
padding:10px;
margin:5px;
border-radius:5px;
border:none;
}

button{
background:#22c55e;
color:white;
cursor:pointer;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #334155;
}

.accept{
background:#22c55e;
}

.reject{
background:#ef4444;
}

</style>

</head>
<body>

<h1>لوحة التحكم</h1>

<div class="card">

<h3>اضافة خدمة</h3>

<input id="serviceName" placeholder="اسم الخدمة">

<button onclick="addService()">اضافة</button>

</div>

<div class="card">

<h3>اضافة فني</h3>

<input id="techName" placeholder="اسم الفني">

<input id="techPhone" placeholder="رقم الفني">

<input id="techService" placeholder="الخدمة">

<button onclick="addTech()">اضافة</button>

</div>

<div class="card">

<h3>الطلبات</h3>

<table>

<thead>

<tr>

<th>الهاتف</th>
<th>الخدمة</th>
<th>الحالة</th>
<th>تغيير</th>

</tr>

</thead>

<tbody id="orders"></tbody>

</table>

</div>

<script>

async function loadOrders(){

const res = await fetch("/api/orders");

const data = await res.json();

let html="";

data.forEach(o=>{

html+=`
<tr>

<td>${o.phone}</td>

<td>${o.service}</td>

<td>${o.status}</td>

<td>

<button class="accept" onclick="update('${o.id}','accepted')">قبول</button>

<button class="reject" onclick="update('${o.id}','rejected')">رفض</button>

</td>

</tr>
`;

});

document.getElementById("orders").innerHTML=html;

}

async function update(id,status){

await fetch("/api/orders/"+id,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({status})

});

loadOrders();

}

async function addService(){

const name=document.getElementById("serviceName").value;

await fetch("/api/services",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({name})

});

alert("تمت الاضافة");

}

async function addTech(){

await fetch("/api/technicians",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:techName.value,
phone:techPhone.value,
service:techService.value

})

});

alert("تمت الاضافة");

}

loadOrders();

setInterval(loadOrders,3000);

</script>

</body>
</html>
