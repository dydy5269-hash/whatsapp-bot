<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<title>لوحة التحكم</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>

<body>

<h1>لوحة التحكم</h1>

<div class="card">

<p>عدد الفنيين: <span id="techCount">0</span></p>

<p>عدد الخدمات: <span id="serviceCount">0</span></p>

<p>عدد الطلبات: <span id="orderCount">0</span></p>

<p>عدد قطع الغيار: <span id="partsCount">0</span></p>

</div>

<br>

<a href="services.html">الخدمات</a>
<br>
<a href="technicians.html">الفنيين</a>
<br>
<a href="orders.html">الطلبات</a>
<br>
<a href="parts.html">قطع الغيار</a>

<script>

const firebaseConfig = {

apiKey: "PUT_API_KEY",
authDomain: "PUT_DOMAIN",
projectId: "PUT_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

async function loadStats(){

techCount.innerText =
(await db.collection("technicians").get()).size;

serviceCount.innerText =
(await db.collection("services").get()).size;

orderCount.innerText =
(await db.collection("orders").get()).size;

partsCount.innerText =
(await db.collection("parts").get()).size;

}

loadStats();

</script>

</body>
</html>
