<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<title>إدارة الفنيين</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>

<body>

<h2>إدارة الفنيين</h2>

<div class="card">

<input id="techName" placeholder="اسم الفني">

<input id="techPhone" placeholder="رقم الهاتف">

<input id="techBalance" placeholder="الرصيد">

<button onclick="addTechnician()">إضافة فني</button>

</div>

<br>

<table border="1" width="100%">

<thead>

<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>الرصيد</th>
<th>حذف</th>
</tr>

</thead>

<tbody id="techTable"></tbody>

</table>

<script>

const firebaseConfig = {

apiKey: "PUT_API_KEY",
authDomain: "PUT_DOMAIN",
projectId: "PUT_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


// إضافة فني

async function addTechnician(){

const name = techName.value;
const phone = techPhone.value;
const balance = Number(techBalance.value);

await db.collection("technicians").add({

name,
phone,
balance,
active:true,
createdAt:new Date()

});

techName.value="";
techPhone.value="";
techBalance.value="";

loadTechnicians();

}


// تحميل الفنيين

async function loadTechnicians(){

const snapshot = await db.collection("technicians").get();

let html="";

snapshot.forEach(doc=>{

const t=doc.data();

html+=`

<tr>

<td>${t.name}</td>

<td>${t.phone}</td>

<td>${t.balance}</td>

<td>
<button onclick="deleteTech('${doc.id}')">
حذف
</button>
</td>

</tr>

`;

});

techTable.innerHTML=html;

}


// حذف فني

async function deleteTech(id){

await db.collection("technicians").doc(id).delete();

loadTechnicians();

}


loadTechnicians();

</script>

</body>

</html>
