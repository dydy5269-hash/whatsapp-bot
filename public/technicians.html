<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة الفني</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.card {
  background: #222;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}

button {
  margin: 5px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>

</head>
<body>

<h2>👨‍🔧 لوحة الفني</h2>

<input id="phone" placeholder="رقم الفني" />
<button onclick="loadOrders()">عرض الطلبات</button>

<div id="orders"></div>

<script>

const API = ""; // خليه فاضي لأنه نفس السيرفر

async function loadOrders() {
  const phone = document.getElementById("phone").value;

  const res = await fetch(`/tech/${phone}/orders`);
  const data = await res.json();

  const container = document.getElementById("orders");
  container.innerHTML = "";

  data.forEach(o => {
    container.innerHTML += `
      <div class="card">
        <h3>${o.serviceName || "خدمة"}</h3>
        <p>الحالة: ${o.status}</p>

        <button onclick="update('${o.id}','accepted')">قبول</button>
        <button onclick="update('${o.id}','on_the_way')">في الطريق</button>
        <button onclick="update('${o.id}','done')">تم</button>
      </div>
    `;
  });
}

async function update(id, status) {
  await fetch(`/order/${id}/status`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status })
  });

  loadOrders();
}

</script>

</body>
</html>
