<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<title>قطع الغيار</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>

<body>

<h2>قطع الغيار</h2>

<div class="card">

<input id="partName" placeholder="اسم القطعة">

<input id="partPrice" placeholder="السعر">

<button onclick="addPart()">إضافة</button>

</div>

<table>

<tbody id="partsTable"></tbody>

</table>

<script>

const firebaseConfig={
apiKey:"PUT_API_KEY",
authDomain:"PUT_DOMAIN",
projectId:"PUT_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

async function addPart(){

await db.collection("parts").add({

name:partName.value,
price:Number(partPrice.value)

});

loadParts();

}

async function loadParts(){

const snapshot=await db.collection("parts").get();

let html="";

snapshot.forEach(doc=>{

const p=doc.data();

html+=`

<tr>

<td>${p.name}</td>

<td>${p.price}</td>

<td>

<button onclick="deletePart('${doc.id}')">

حذف

</button>

</td>

</tr>

`;

});

partsTable.innerHTML=html;

}

async function deletePart(id){

await db.collection("parts").doc(id).delete();

loadParts();

}

loadParts();

</script>

</body>

</html>
