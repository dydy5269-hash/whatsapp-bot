<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<title>الخدمات</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>

<body>

<h2>إدارة الخدمات</h2>

<div class="card">

<input id="serviceName" placeholder="اسم الخدمة">

<input id="servicePrice" placeholder="السعر">

<button onclick="addService()">إضافة</button>

</div>

<table border="1">

<tbody id="serviceTable"></tbody>

</table>

<script>

const firebaseConfig={
apiKey:"PUT_API_KEY",
authDomain:"PUT_DOMAIN",
projectId:"PUT_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

async function addService(){

await db.collection("services").add({

name:serviceName.value,
price:Number(servicePrice.value)

});

loadServices();

}

async function loadServices(){

const snapshot=await db.collection("services").get();

let html="";

snapshot.forEach(doc=>{

const s=doc.data();

html+=`
<tr>

<td>${s.name}</td>

<td>${s.price}</td>

<td>
<button onclick="deleteService('${doc.id}')">
حذف
</button>
</td>

</tr>
`;

});

serviceTable.innerHTML=html;

}

async function deleteService(id){

await db.collection("services").doc(id).delete();

loadServices();

}

loadServices();

</script>

</body>
</html>
